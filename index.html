<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#19251b" />
    <meta name="description" content="Run John's farm through a full winter wheat season." />
    <title>Farmables — John's Farm</title>
  </head>
  <body>
    <main id="game" aria-label="Farmables 3D game">
      <div id="scene" aria-hidden="true"></div>
      <div class="vignette" aria-hidden="true"></div>
      <header class="hud-top">
        <div class="game-mark" aria-label="Farmables">✳</div>
        <div class="hud-stats"><span id="date">20 AUG 2026</span><span id="time-weather"><span id="time-label">08:30</span> <span id="weather-icon">◑</span> <span id="weather-name">PARTLY CLOUDY</span></span><span class="stat-divider"></span><span class="coin-mark">◈</span><span id="coins">2,150</span></div>
        <button id="fullscreen" class="icon-button" type="button" aria-label="Toggle fullscreen" title="Fullscreen">⛶</button>
      </header>
      <section id="field-status" aria-live="polite">
        <div class="status-heading"><span id="phase">CLEAR ACCESS</span><span id="progress">0 / 2</span></div>
        <div id="objective">Clear the weeds by the field gate.</div>
        <div class="progress-track"><div id="progress-fill"></div></div>
      </section>
      <canvas id="minimap" width="180" height="180" aria-label="Farm map"></canvas>
      <button id="interact" type="button" hidden><kbd>E</kbd><span id="interact-text"></span></button>
      <div id="drive-hud" hidden><span id="vehicle-name">TRACTOR</span><span id="vehicle-speed">0 km/h</span><span id="drive-progress"></span></div>
      <div id="toast" role="status" aria-live="polite"></div>
      <section id="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title" hidden>
        <div class="panel-header"><div><div id="panel-kicker"></div><h2 id="panel-title"></h2></div><button id="panel-close" type="button" aria-label="Close">×</button></div>
        <div id="panel-options"></div>
      </section>
      <button id="help-toggle" class="icon-button" type="button" aria-label="Controls" title="Controls">?</button>
      <div id="help" hidden><strong>Controls</strong><span>WASD / arrows · move</span><span>Shift · hold to sprint</span><span>C · toggle sprint</span><span>Drag · look around</span><span>E · interact / exit vehicle</span><span>Esc · close menu</span><button id="reset-farm" type="button">Start a new farm</button></div>
      <button id="sprint-toggle" type="button" aria-pressed="false" title="Toggle sprint (C)">WALK</button>
      <div id="mobile-controls" aria-label="Touch movement controls">
        <div id="joystick"><div id="joystick-knob"></div></div>
      </div>
      <div id="loading" role="status"><div class="loading-brand">✳ Farmables</div><div class="loading-subtitle">Growing the countryside…</div></div>
      <div id="error" role="alert" hidden></div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
